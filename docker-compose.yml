# Backing service for local development and single-host production.
# LULU v1 needs only PostgreSQL: job scheduling, job state, outbox and rate
# limits all live in Postgres (no Redis / BullMQ).
# Usage: cp .env.example .env  →  fill in secrets  →  docker compose up -d
# Ports are bound to 127.0.0.1 only; nothing is exposed to the network.
name: lulu

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lulu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lulu}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # postgres >= 18 keeps PGDATA in a versioned subdirectory of this path
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
